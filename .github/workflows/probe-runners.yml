name: probe-runners
# Which Xcode versions do the current macOS runner images ship? (xnu-8796 needs Xcode 15's iig)
on: workflow_dispatch
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - run: |
          sw_vers
          ls -d /Applications/Xcode*.app
          ls /Library/Developer/CommandLineTools/SDKs 2>/dev/null || true
